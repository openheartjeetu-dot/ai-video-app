<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Subway Dash 3D</title>
<style>
html,body{margin:0;background:#0d0d16;overflow:hidden;height:100%;font-family:system-ui,Roboto,sans-serif;touch-action:none}
canvas{display:block}
.hud{position:fixed;top:12px;left:0;right:0;display:none;justify-content:space-between;padding:0 18px;color:#ffd700;font-weight:800;font-size:22px;text-shadow:0 2px 8px #000}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,8,18,.85);color:#fff;text-align:center;padding:24px}
h1{font-size:34px;margin:0 0 10px;background:linear-gradient(90deg,#ffd700,#ff6b6b,#6c5ce7);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#aab;font-size:15px;line-height:1.8;margin:0 0 24px}
button{background:linear-gradient(90deg,#6c5ce7,#a55eea);color:#fff;border:0;border-radius:14px;padding:16px 50px;font-size:19px;font-weight:800}
</style></head><body>
<div class=hud id=hud><span id=sc>🏆 0</span><span id=cn>🪙 0</span></div>
<div class=ov id=menu><h1>🚇 SUBWAY DASH 3D</h1><p>Swipe ⬅️➡️ lane • ⬆️ jump • ⬇️ slide<br>Dodge trains, grab coins!</p><button onclick=start()>▶ PLAY</button></div>
<div class=ov id=over style=display:none><h1>💥 CRASHED!</h1><p id=final></p><button onclick=start()>🔄 RUN AGAIN</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i),LANE=2.4;
let W=innerWidth,H=innerHeight,run=false,t=0,spd=0,score=0,coins=0,best=+localStorage.best||0;
let lane=0,px=0,py=0,vy=0,slideT=0,dead=false,spawnT=0,objs=[];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x2b1b4d);scene.fog=new THREE.Fog(0x2b1b4d,30,95);
const cam=new THREE.PerspectiveCamera(70,W/H,.1,200);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(W,H);ren.setPixelRatio(Math.min(2,devicePixelRatio||1));document.body.appendChild(ren.domElement);
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;cam.aspect=W/H;cam.updateProjectionMatrix();ren.setSize(W,H)});
scene.add(new THREE.DirectionalLight(0xffeaa7,1),new THREE.AmbientLight(0x8877bb,.8));
const M=c=>new THREE.MeshLambertMaterial({color:c});
const box=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);return m};
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(60,240),M(0x191930));gnd.rotation.x=-Math.PI/2;gnd.position.z=-80;scene.add(gnd);
const rd=new THREE.Mesh(new THREE.PlaneGeometry(7.6,240),M(0x2e2e4a));rd.rotation.x=-Math.PI/2;rd.position.set(0,.01,-80);scene.add(rd);
scene.add(box(.15,.12,240,0x6c5ce7,-3.8,.06,-80),box(.15,.12,240,0x6c5ce7,3.8,.06,-80));
const sleepers=[];for(let i=0;i<40;i++){const s=box(7.4,.07,.5,0x3d3d5c,0,.03,-i*4);scene.add(s);sleepers.push(s)}
const blds=[];for(let i=0;i<16;i++){const h=6+((i*37)%10);const b=box(5,h,6,0x14142c,(i%2?1:-1)*(10+(i%3)*2),h/2,-i*12);scene.add(b);blds.push(b)}
const P=new THREE.Group();
const legG=new THREE.BoxGeometry(.22,.7,.22);legG.translate(0,-.35,0);
const legL=new THREE.Mesh(legG,M(0x2d3436));legL.position.set(-.16,.72,0);
const legR=new THREE.Mesh(legG.clone(),M(0x2d3436));legR.position.set(.16,.72,0);
P.add(box(.55,.75,.32,0x6c5ce7,0,1.1,0),box(.4,.4,.4,0xffe0b2,0,1.72,0),box(.44,.15,.44,0xff7675,0,1.95,0),legL,legR);
scene.add(P);
function addObj(type,l,z){const g=new THREE.Group();
if(type=='train')g.add(box(2,2.6,9,0xe17055,0,1.3,0),box(1.6,.8,.1,0x74b9ff,0,1.7,4.51));
else if(type=='low')g.add(box(1.9,.45,.18,0xd63031,0,.55,0),box(1.9,.12,.19,0xffeaa7,0,.62,0),box(.12,.6,.12,0xb2bec3,-.8,.3,0),box(.12,.6,.12,0xb2bec3,.8,.3,0));
else if(type=='high')g.add(box(1.9,.45,.18,0x0984e3,0,1.6,0),box(.12,1.8,.12,0xb2bec3,-.9,.9,0),box(.12,1.8,.12,0xb2bec3,.9,.9,0));
else{const c=new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.08,16),M(0xffd700));c.rotation.x=Math.PI/2;c.position.y=1;g.add(c)}
g.position.set(l*LANE,0,z);g.userData={type,lane:l};scene.add(g);objs.push(g)}
let AC;function sfx(f,d,tp){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=tp||'square';o.frequency.value=f;g.gain.value=.15;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function die(){if(dead)return;dead=true;run=false;sfx(110,.4,'sawtooth');
if(score>best){best=Math.floor(score);localStorage.best=best}
setTimeout(()=>{$('final').innerHTML='Score <b>'+Math.floor(score)+'</b> • Coins <b>'+coins+'</b><br>Best <b>'+best+'</b>';$('over').style.display='flex';$('hud').style.display='none'},300)}
function start(){for(const o of objs)scene.remove(o);objs=[];
lane=0;px=0;py=0;vy=0;slideT=0;dead=false;spd=.3;score=0;coins=0;t=0;spawnT=50;
$('menu').style.display='none';$('over').style.display='none';$('hud').style.display='flex';run=true;sfx(660,.1)}
