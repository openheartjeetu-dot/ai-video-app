<!DOCTYPE html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Subway Dash</title>
<style>
html,body{margin:0;background:#0d0d16;overflow:hidden;height:100%;font-family:system-ui,Roboto,sans-serif;touch-action:none}
#c{display:block;width:100vw;height:100vh}
.hud{position:fixed;top:12px;left:0;right:0;display:none;justify-content:space-between;padding:0 18px;color:#ffd700;font-weight:800;font-size:22px;text-shadow:0 2px 8px #000}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,8,18,.85);color:#fff;text-align:center;padding:24px}
h1{font-size:36px;margin:0 0 10px;background:linear-gradient(90deg,#ffd700,#ff6b6b,#6c5ce7);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#aab;font-size:15px;line-height:1.8;margin:0 0 26px}
button{background:linear-gradient(90deg,#6c5ce7,#a55eea);color:#fff;border:0;border-radius:14px;padding:16px 54px;font-size:19px;font-weight:800;box-shadow:0 8px 30px #6c5ce766}
</style></head><body>
<canvas id=c></canvas>
<div class=hud id=hud><span id=sc>🏆 0</span><span id=cn>🪙 0</span></div>
<div class=ov id=menu><h1>🚇 SUBWAY DASH</h1><p>Swipe ⬅️➡️ change lane<br>Swipe ⬆️ jump barriers<br>Swipe ⬇️ slide under signs<br>Dodge trains • Grab coins</p><button onclick=start()>▶ PLAY</button></div>
<div class=ov id=over style=display:none><h1>💥 CRASHED!</h1><p id=final></p><button onclick=start()>🔄 RUN AGAIN</button></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),cx=cv.getContext('2d');
let W,H;function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}rs();addEventListener('resize',rs);
const HOR=()=>H*0.34,BOT=()=>H*0.92;
let run=false,t=0,speed=0.013,score=0,coins=0,best=+localStorage.best||0;
let lane=0,laneV=0,jump=0,slide=0,dead=false,shake=0,objs=[],parts=[],spawn=0;
function P(z,l){const q=z*z;return{x:W/2+l*W*0.30*q,y:HOR()+(BOT()-HOR())*q,s:0.08+0.92*q}}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
let AC;function sfx(f,d,type){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=0.15;g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function burst(x,y,c,n){for(let i=0;i<(n||18);i++)parts.push({x:x,y:y,vx:(Math.random()-0.5)*8,vy:-Math.random()*7,l:30,ml:30,c:c})}
function start(){run=true;dead=false;t=0;speed=0.013;score=0;coins=0;lane=0;laneV=0;jump=0;slide=0;objs=[];parts=[];spawn=0;shake=0;
$('menu').style.display='none';$('over').style.display='none';$('hud').style.display='flex';sfx(660,0.1);loop()}
function die(){if(dead)return;dead=true;run=false;shake=20;sfx(110,0.4,'sawtooth');burst(W/2+lane*W*0.3,BOT()-70,'#ff5252',40);draw();
if(score>best){best=Math.floor(score);localStorage.best=best}
setTimeout(()=>{$('final').innerHTML='Score <b>'+Math.floor(score)+'</b> • Coins <b>'+coins+'</b><br>Best <b>'+best+'</b>';$('over').style.display='flex';$('hud').style.display='none'},400)}
function loop(){if(!run)return;requestAnimationFrame(loop);t++;
speed+=0.0000035;score+=speed*9;
if(jump>0)jump--;if(slide>0)slide--;
laneV+=(lane-laneV)*0.22;
for(const o of objs)o.z+=speed*(1+o.z*2.2);
if(--spawn<=0){spawn=Math.max(13,26-speed*700);const l=(Math.random()*3|0)-1,r=Math.random();
objs.push({lane:l,z:0,type:r<0.34?'coin':r<0.62?'low':r<0.82?'high':'train'})}
for(const o of objs){if(!o.hit&&!o.passed&&o.z>0.82&&o.z<1.03&&o.lane===lane){
if(o.type==='coin'){o.hit=true;coins++;sfx(880,0.08);burst(W/2+lane*W*0.3,BOT()-60,'#ffd700')}
else if(o.type==='low'&&jump>0)o.passed=true;
else if(o.type==='high'&&slide>0)o.passed=true;
else die()}}
objs=objs.filter(o=>o.z<1.16&&!o.hit);
draw();
$('sc').textContent='🏆 '+Math.floor(score);$('cn').textContent='🪙 '+coins}
function drawObj(o,p){const s=p.s;cx.save();cx.translate(p.x,p.y);cx.scale(s,s);cx.globalAlpha=Math.min(1,o.z*5);
if(o.type==='coin'){const w=Math.max(0.25,Math.abs(Math.sin(t*0.1+o.lane)));cx.fillStyle='#ffd700';cx.beginPath();cx.ellipse(0,-40,26*w,26,0,0,7);cx.fill();cx.fillStyle='#fff3b0';cx.beginPath();cx.ellipse(0,-40,12*w,12,0,0,7);cx.fill()}
else if(o.type==='low'){cx.fillStyle='#d63031';cx.fillRect(-55,-46,110,16);cx.fillStyle='#ffeaa7';for(let i=-55;i<55;i+=22)cx.fillRect(i,-46,11,16);cx.fillStyle='#b2bec3';cx.fillRect(-50,-30,8,30);cx.fillRect(42,-30,8,30)}
else if(o.type==='high'){cx.fillStyle='#b2bec3';cx.fillRect(-52,-120,8,120);cx.fillRect(44,-120,8,120);cx.fillStyle='#0984e3';cx.fillRect(-60,-120,120,26);cx.fillStyle='#fff';cx.font='bold 18px sans-serif';cx.textAlign='center';cx.fillText('DUCK',0,-101)}
else{cx.fillStyle='#e17055';rr(-62,-190,124,190,14);cx.fill();cx.fillStyle='#2d3436';cx.fillRect(-62,-30,124,30);cx.fillStyle='#74b9ff';rr(-46,-170,92,60,10);cx.fill();cx.fillStyle='#ffeaa7';cx.beginPath();cx.arc(-38,-14,10,0,7);cx.fill();cx.beginPath();cx.arc(38,-14,10,0,7);cx.fill()}
cx.restore();cx.globalAlpha=1}
function drawPlayer(){const p=P(1,laneV);const jy=jump>0?Math.sin((18-jump)/18*Math.PI)*95:0;
cx.save();cx.translate(p.x,p.y-jy);if(slide>0)cx.scale(1,0.55);
const r=Math.sin(t*0.35);
cx.fillStyle='rgba(0,0,0,0.4)';cx.beginPath();cx.ellipse(0,2+jy*0.4,34,10,0,0,7);cx.fill();
cx.strokeStyle='#2d3436';cx.lineWidth=9;cx.lineCap='round';
cx.beginPath();cx.moveTo(0,-38);cx.lineTo(r*16,-4+(r>0?0:6));cx.stroke();
cx.beginPath();cx.moveTo(0,-38);cx.lineTo(-r*16,-4+(r>0?6:0));cx.stroke();
cx.fillStyle='#6c5ce7';rr(-14,-78,28,44,10);cx.fill();
cx.strokeStyle='#6c5ce7';cx.lineWidth=8;
cx.beginPath();cx.moveTo(0,-70);cx.lineTo(-r*14,-52);cx.stroke();
cx.beginPath();cx.moveTo(0,-70);cx.lineTo(r*14,-52);cx.stroke();
cx.fillStyle='#ffe0b2';cx.beginPath();cx.arc(0,-92,14,0,7);cx.fill();
cx.fillStyle='#ff7675';cx.beginPath();cx.arc(0,-98,14,Math.PI,0);cx.fill();
cx.restore()}
function draw(){cx.clearRect(0,0,W,H);cx.save();
if(shake>0){shake--;cx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake)}
let g=cx.createLinearGradient(0,0,0,HOR());g.addColorStop(0,'#0b0b2a');g.addColorStop(1,'#2b1b4d');cx.fillStyle=g;cx.fillRect(0,0,W,HOR());
cx.fillStyle='#fff';for(let i=0;i<40;i++){cx.globalAlpha=0.3+0.7*Math.abs(Math.sin(i*7+t*0.02));cx.fillRect((i*97)%W,(i*53)%(HOR()*0.8),2,2)}cx.globalAlpha=1;
cx.fillStyle='#191938';for(let i=0;i<9;i++){const bw=W/9,bh=30+((i*37)%50);cx.fillRect(i*bw,HOR()-bh,bw-6,bh)}
const th=W*0.10,bh2=W*0.62;
g=cx.createLinearGradient(0,HOR(),0,H);g.addColorStop(0,'#20203a');g.addColorStop(1,'#2e2e4a');cx.fillStyle=g;
cx.beginPath();cx.moveTo(W/2-th,HOR());cx.lineTo(W/2+th,HOR());cx.lineTo(W/2+bh2,H);cx.lineTo(W/2-bh2,H);cx.fill();
cx.strokeStyle='#6c5ce7';cx.lineWidth=3;
cx.beginPath();cx.moveTo(W/2-th,HOR());cx.lineTo(W/2-bh2,H);cx.stroke();
cx.beginPath();cx.moveTo(W/2+th,HOR());cx.lineTo(W/2+bh2,H);cx.stroke();
for(const b of[-0.5,0.5]){cx.strokeStyle='#8888bb';cx.lineWidth=2;cx.setLineDash([18,26]);cx.lineDashOffset=-t*speed*260;
cx.beginPath();cx.moveTo(W/2+b*th*1.6,HOR());cx.lineTo(W/2+b*bh2*1.6,H);cx.stroke();cx.setLineDash([])}
for(const o of[...objs].sort((a,b)=>a.z-b.z))drawObj(o,P(o.z,o.lane));
drawPlayer();
for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=0.3;q.l--}
parts=parts.filter(q=>q.l>0);
for(const q of parts){cx.globalAlpha=q.l/q.ml;cx.fillStyle=q.c;cx.fillRect(q.x,q.y,4,4)}cx.globalAlpha=1;
cx.strokeStyle='rgba(255,255,255,0.12)';cx.lineWidth=2;
for(let i=0;i<6;i++){const y=(i*131+t*7)%H;cx.beginPath();cx.moveTo(0,y);cx.lineTo(30,y+8);cx.stroke();cx.beginPath();cx.moveTo(W,y);cx.lineTo(W-30,y+8);cx.stroke()}
cx.restore()}
let tx,ty;
addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(!run)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
if(Math.abs(dx)>Math.abs(dy)){if(dx>24&&lane<1)lane++;else if(dx<-24&&lane>-1)lane--}
else{if(dy<-24&&jump===0)jump=18;else if(dy>24&&slide===0)slide=18}},{passive:true});
addEventListener('keydown',e=>{if(!run)return;if(e.key==='ArrowLeft'&&lane>-1)lane--;if(e.key==='ArrowRight'&&lane<1)lane++;if(e.key==='ArrowUp')jump=18;if(e.key==='ArrowDown')slide=18});
draw();
</script></body></html>
